<style>
/* Layout: an iPhone-native field tool. Grouped inset lists on system gray, the phone's own type, one accent (county blue); green/red only carry Yes/No. */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --cell-hi:#E5E5EA; --fill:#7676801F; --thumb:#FFFFFF;
  --label:#000000; --label-2:#3C3C4399; --label-3:#3C3C434D; --sep:#3C3C434A;
  --accent:#0B5CAD; --accent-soft:#0B5CAD14; --yes:#248A3D; --no:#D70015; --warn:#B25000;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1C1C1E; --cell-hi:#2C2C2E; --fill:#7676803D; --thumb:#636366;
  --label:#FFFFFF; --label-2:#EBEBF599; --label-3:#EBEBF54D; --sep:#54545899;
  --accent:#4C9BF0; --accent-soft:#4C9BF01F; --yes:#30D158; --no:#FF453A; --warn:#FF9F0A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --cell-hi:#2C2C2E; --fill:#7676803D; --thumb:#636366;
  --label:#FFFFFF; --label-2:#EBEBF599; --label-3:#EBEBF54D; --sep:#54545899;
  --accent:#4C9BF0; --accent-soft:#4C9BF01F; --yes:#30D158; --no:#FF453A; --warn:#FF9F0A; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--label)}
body{font-family:var(--sans);font-size:17px;line-height:1.3;letter-spacing:-.01em;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:600px;margin-inline:auto}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.9em;letter-spacing:0}

/* nav bar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:48px;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(8px,env(safe-area-inset-left,0px));border-bottom:.5px solid transparent;transition:border-color 200ms ease}
.nav.scrolled{border-bottom-color:var(--sep)}
.nav .mid{font-weight:600;font-size:17px;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity 200ms ease}
.nav.scrolled .mid{opacity:1}
.nav .l{justify-self:start}.nav .r{justify-self:end}
.navbtn{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;min-height:44px;padding:0 8px;border-radius:8px;transition:opacity 120ms ease}
.navbtn:active{opacity:.4}
.navbtn svg{width:22px;height:22px}
.big{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.1;padding:4px 0 2px}
.bigsub{color:var(--label-2);font-size:15px;padding-bottom:6px}

/* grouped lists */
.grp{margin-top:22px}
.ghrow{display:flex;align-items:baseline;justify-content:space-between;padding-right:8px}
.ghrow .gh{padding-bottom:7px}
.ghbtn{color:var(--accent);font-size:15px;padding:4px 8px;min-height:32px}
.ghbtn.on{font-weight:600}
.minus{width:22px;height:22px;border-radius:50%;background:var(--no);color:#fff;display:grid;place-items:center;flex:none;font-weight:700;font-size:17px;line-height:1;animation:popin 220ms var(--ease-out) both}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.confirm-row{display:grid;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--no) 8%,var(--cell))}
.confirm-row p{font-size:15px;line-height:1.35}
.confirm-row .acts{display:flex;gap:10px}
.confirm-row .acts button{flex:1;text-align:center;min-height:40px;border-radius:9px;font-weight:600;font-size:15px}
.confirm-row .del{background:var(--no);color:#fff}
.confirm-row .keep{background:var(--fill);color:var(--label)}
.gh{font-size:13px;font-weight:400;color:var(--label-2);text-transform:uppercase;letter-spacing:.02em;padding:0 16px 7px}
.gf{font-size:13px;color:var(--label-2);padding:7px 16px 0;line-height:1.35}
.cells{background:var(--cell);border-radius:10px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:11px 16px;text-align:left;background:var(--cell);transition:background-color 200ms ease}
.cell+.cell::before,.cell+.cell-x::before,.cell-x+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
button.cell:active,.cell.tap:active{background:var(--cell-hi);transition:none}
.cell .main{flex:1;min-width:0;display:grid;gap:2px}
.cell .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .sub{font-size:13px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .det{color:var(--label-2);white-space:nowrap}
.cell .chev{width:14px;height:14px;color:var(--label-3);flex:none}
.cell.accent{color:var(--accent)}
.cell.accent svg{width:22px;height:22px}
.cell.danger{color:var(--no);justify-content:center}
.cell.center{justify-content:center;color:var(--accent);font-weight:600}
.badge{min-width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;background:var(--fill);color:var(--label-2);flex:none}
.badge.done{background:var(--yes);color:#fff}
.badge svg{width:16px;height:16px}
.st-done{color:var(--yes)}.st-fix{color:var(--no)}.st-open{color:var(--label-2)}

/* form rows */
.field{display:grid;gap:3px;padding:9px 16px 10px}
.field>span{font-size:13px;color:var(--label-2)}
.field input,.field textarea{width:100%;border:0;background:transparent;padding:0;font-size:17px;outline:none;min-height:24px}
.field input::placeholder,.field textarea::placeholder{color:var(--label-3)}
.field textarea{resize:none;line-height:1.35;min-height:72px;font-size:16px}
.field input[type=date]{min-height:28px}
.row2{display:grid;grid-template-columns:1fr 1fr}
.row2>.cell-x+.cell-x{border-left:.5px solid var(--sep)}
.cell-x{position:relative;background:var(--cell)}

/* segmented control with sliding thumb */
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:12px;align-items:center}
.qstack{display:grid;gap:10px;padding:12px 16px}
.qstack .ql{font-size:16px;line-height:1.3}
.sc{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;background:var(--fill);border-radius:10px;padding:3px;height:40px}
.sc .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px - (var(--n) - 1) * 2px) / var(--n));border-radius:8px;background:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.18);transform:translateX(calc(var(--i,0) * (100% + 2px)));transition:transform 240ms var(--ease-out),background-color 200ms ease,opacity 150ms ease}
.sc[data-v="Yes"] .thumb{background:var(--yes)}
.sc[data-v="No"] .thumb{background:var(--no)}
.sc[data-v="N/A"] .thumb{background:#8E8E93}
.sc[data-v=""] .thumb{opacity:0;transition:none}
.sc.snap .thumb{transition:opacity 150ms ease}
.sc button{position:relative;z-index:1;text-align:center;font-size:15px;font-weight:600;color:var(--label-2);border-radius:8px;transition:color 150ms ease}
.sc button:active{opacity:.6}
.sc button[aria-pressed="true"]{color:#fff}

/* check rows (multi or single select) */
.check{align-items:flex-start}
.check .txt{flex:1;min-width:0;font-size:15px;line-height:1.35}
.check .mark{width:22px;height:22px;flex:none;color:var(--accent);opacity:0;transform:scale(.5);transition:opacity 150ms ease,transform 220ms var(--ease-out)}
.check[aria-pressed="true"] .mark{opacity:1;transform:none}
.check.circle .mark{opacity:1;transform:none;color:var(--label-3)}
.check.circle[aria-pressed="true"] .mark{color:var(--accent)}
.check .mark .on{opacity:0;transition:opacity 150ms ease}.check[aria-pressed="true"] .mark .on{opacity:1}
.blank{background:color-mix(in srgb,var(--warn) 18%,transparent);border-radius:3px;padding:0 3px}
.tag{font-size:13px;color:var(--accent);white-space:nowrap}

/* step progress + bottom toolbar */
.prog{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;padding:2px 0 8px}
.prog i{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;position:relative}
.prog i::after{content:"";position:absolute;inset:0;background:var(--accent);transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform 400ms var(--ease-out)}
.prog i.cur{background:color-mix(in srgb,var(--accent) 30%,var(--fill))}
.toolbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.toolbar .in{max-width:600px;margin-inline:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.toolbar .pos{font-size:13px;color:var(--label-2);text-align:center}
.pbtn{justify-self:end;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;font-weight:600;border-radius:12px;min-height:44px;padding:0 18px;transition:opacity 120ms ease,transform 120ms var(--ease-out)}
.pbtn:active{transform:scale(.97);opacity:.85}
.pbtn:disabled{opacity:.5}
.pbtn svg{width:18px;height:18px}
.wide-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:#fff;font-weight:600;border-radius:12px;min-height:50px;margin-top:22px;transition:opacity 120ms ease,transform 120ms var(--ease-out)}
.wide-btn:active{transform:scale(.98);opacity:.85}
.wide-btn:disabled{opacity:.5}
.wide-btn svg{width:20px;height:20px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin 800ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* steps sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.32);opacity:0;transition:opacity 280ms ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:600px;margin-inline:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform 320ms var(--ease-drawer);max-height:85dvh;overflow:auto;overscroll-behavior:contain}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:0 auto 10px}
.sheet-open .scrim{opacity:1}.sheet-open .sheet{transform:none}
.sheet h3{font-size:17px;font-weight:600;text-align:center;padding-bottom:4px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:40;max-width:calc(100% - 48px);background:color-mix(in srgb,var(--cell) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--label);padding:12px 18px;border-radius:14px;font-size:15px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.18);transform:translate(-50%,12px) scale(.96);opacity:0;pointer-events:none;transition:transform 300ms var(--ease-out),opacity 200ms ease}
.toast.show{transform:translate(-50%,0) scale(1);opacity:1}

/* motion */
.push-f{animation:pushF 300ms var(--ease-out) both}
.push-b{animation:pushB 300ms var(--ease-out) both}
@keyframes pushF{from{opacity:0;transform:translateX(24px)}}
@keyframes pushB{from{opacity:0;transform:translateX(-24px)}}
.fadein{animation:fadein 220ms ease both}
@keyframes fadein{from{opacity:0}}
.open-down{animation:openDown 260ms var(--ease-out) both}
@keyframes openDown{from{opacity:0;transform:translateY(-6px)}}
.pop{animation:pop 450ms var(--ease-out) both}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (hover:hover) and (pointer:fine){button.cell:hover{background:color-mix(in srgb,var(--cell-hi) 50%,var(--cell))}}
.chk-item{align-items:flex-start}
.chk-item .dot{width:22px;height:22px;flex:none;border-radius:50%;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.chk-item.ok .dot{background:color-mix(in srgb,var(--yes) 16%,transparent);color:var(--yes)}
.chk-item.ok .dot svg{width:14px;height:14px}
.chk-item .main{white-space:normal}
.chk-item .ttl{font-size:15px;line-height:1.35;white-space:normal}
.chk-item.ok .ttl{color:var(--label-2)}
.chk-item .where{font-size:13px;color:var(--accent);margin-top:2px}
.chkbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:7;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.chkbar .in{pointer-events:auto;max-width:600px;margin-inline:auto;background:color-mix(in srgb,var(--cell) 94%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.16),0 0 0 .5px var(--sep);padding:10px 12px 10px;animation:barIn 320ms var(--ease-out) both}
@keyframes barIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
.chkbar .top{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--label-2)}
.chkbar .top b{color:var(--warn);font-weight:600;white-space:nowrap}
.chkbar .top .x{margin-left:auto}
.chkbar .note{font-size:15px;line-height:1.35;color:var(--label);margin:4px 0 8px}
.chkbar .acts{display:grid;grid-template-columns:44px 1fr 44px;gap:8px}
.chkbar .acts button{height:40px;border-radius:10px;background:var(--fill,color-mix(in srgb,var(--label) 8%,transparent));color:var(--accent);font-weight:600;font-size:15px;text-align:center;display:grid;place-items:center}
.chkbar .acts button:disabled{opacity:.35}
.chkbar .acts .good{background:var(--yes);color:#fff}
.chkbar .acts .good.ok{background:color-mix(in srgb,var(--yes) 16%,transparent);color:var(--yes)}
.chkbar .acts button:active{transform:scale(.97)}
body.has-chk{padding-bottom:300px}
body.has-chk .toast{bottom:calc(250px + env(safe-area-inset-bottom,0px))}
.hl{position:relative;border-radius:10px;animation:hl 2.4s var(--ease-out) both}
@keyframes hl{0%,30%{box-shadow:inset 0 0 0 2.5px var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--cell))}100%{box-shadow:inset 0 0 0 2.5px color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 6%,var(--cell))}}
@media (prefers-reduced-motion: reduce){
  .push-f,.push-b,.open-down,.pop{animation:fadein 150ms ease both}
  .hl{animation:none;box-shadow:inset 0 0 0 2.5px var(--warn)}
  .chkbar .in{animation:none}
  .sc .thumb,.sheet{transition-duration:0ms}
  .pbtn:active,.wide-btn:active{transform:none}
}
</style>

    <div class="acts"><button id="chkPrev" ${x===0?'disabled':''} aria-label="Previous">${IC.back}</button><button class="good ${c.ok?'ok':''}" id="chkOk">${c.ok?'Checked ✓':'Looks Good'}</button><button id="chkNext" ${x===L.length-1?'disabled':''} aria-label="Next">${IC.next}</button></div>
  </div></div>`}
function chkTarget(k){
  const base=String(k||'').replace(/(^b\d)(n|sel)$/,'$1');
  let el=document.querySelector(`#app [data-t="${k}"]`)||document.querySelector(`#app [data-k="${k}"]`)||document.querySelector(`#app #q_${base}`)||document.querySelector(`#app [data-t="${base}"]`);
  if(el&&/^b\d$/.test(base)&&/n$/.test(k)){const t=document.querySelector(`#app [data-t="${k}"]`);el=t||el}
  if(!el)return null;
  if(el.matches('.cell[data-k]'))return el.closest('.cells')||el;
  return el.closest('.cell,.cell-x,.qrow,.qstack')||el}
function goChk(x){const r=S.items[view.id],L=chkList(r);if(!L[x])return;
  view.chk=x;const st=keyStep(L[x].key);
  if(st!==view.step){view.anim=st>view.step?'push-f':'push-b';view.step=st;closeSheet();render()}else rerender();
  requestAnimationFrame(()=>{const el=chkTarget(L[x].key);
    if(!el){scrollTo({top:0,behavior:'smooth'});return}
    el.classList.remove('hl');void el.offsetWidth;el.classList.add('hl');
    const box=el.getBoundingClientRect(),room=innerHeight-260;
    scrollTo({top:Math.max(0,scrollY+box.top-Math.max(70,(room-box.height)/2)),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})})}

function render(){
  const app=$('#app');
  app.innerHTML=view.name==='home'?homeHTML():view.name==='day'?dayHTML():inspHTML();
  if(view.anim){const t=app.querySelector('.body');if(t)t.classList.add(view.anim==='fade'?'fadein':view.anim);view.anim=null}
  document.body.classList.toggle('has-chk',view.name==='insp'&&view.chk!=null);
  bind();onScroll();
  view.reveal=null;view.justDone=null;
}
function onScroll(){const n=document.querySelector('.nav');if(n)n.classList.toggle('scrolled',scrollY>30)}
addEventListener('scroll',onScroll,{passive:true});

function medDate(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}
function nav(left,mid,right){return `<div class="nav"><span class="l">${left||''}</span><span class="mid">${esc(mid)}</span><span class="r">${right||''}</span></div>`}
function grpX(title,action,cells,foot){return `<section class="grp"><div class="ghrow"><h3 class="gh">${title}</h3>${action}</div><div class="cells">${cells}</div>${foot?`<p class="gf">${foot}</p>`:''}</section>`}
function editBtn(){return `<button class="ghbtn ${view.edit?'on':''}" id="editToggle">${view.edit?'Done':'Edit'}</button>`}
function confirmRow(key,text,yes){return `<div class="confirm-row open-down"><p>${text}</p><div class="acts"><button class="del" data-yes="${key}">${yes}</button><button class="keep" data-no>Cancel</button></div></div>`}
function grp(title,cells,foot){return `<section class="grp">${title?`<h3 class="gh">${title}</h3>`:''}<div class="cells">${cells}</div>${foot?`<p class="gf">${foot}</p>`:''}</section>`}
function seg(key,val,opts){opts=opts||['Yes','No','N/A'];const i=Math.max(0,opts.indexOf(val));
  return `<div class="sc" role="group" style="--n:${opts.length};--i:${i}" data-v="${val&&opts.includes(val)?esc(val):''}"><span class="thumb"></span>${opts.map(o=>`<button type="button" data-k="${key}" data-v="${esc(o)}" aria-pressed="${val===o}">${esc(o)}</button>`).join('')}</div>`}
function choices(key,val,opts){return opts.map(o=>`<button type="button" class="cell check" data-k="${key}" data-v="${esc(o)}" aria-pressed="${val===o}"><span class="txt" style="font-size:17px">${esc(o)}</span><span class="mark">${IC.check}</span></button>`).join('')}
function field(key,label,val,type,extra){return `<label class="cell-x field"><span>${label}</span><input type="${type||'text'}" id="f_${key}" data-t="${key}" value="${esc(val)}" ${extra||''}></label>`}
function area(key,label,val,ph){return `<label class="cell-x field"><span>${label}</span><textarea id="f_${key}" data-t="${key}" placeholder="${esc(ph||'')}">${esc(val)}</textarea></label>`}
function checkRow(attrs,text,on,circle){return `<button type="button" class="cell check ${circle?'circle':''}" ${attrs} aria-pressed="${on}"><span class="txt">${text}</span><span class="mark">${circle?IC.circle:IC.check}</span></button>`}
const blanks=t=>esc(t).replace(/___/g,'<span class="blank">___</span>');

/* ---------- steps sheet ---------- */
function openSheet(){
  const r=S.items[view.id];if(!r)return;
  $('#sheetRoot').innerHTML=`<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-label="Inspection steps"><div class="grab"></div><button class="navbtn" id="sheetDone" style="position:absolute;right:8px;top:8px;font-weight:600">Done</button><h3>Steps</h3>
    ${grp('',STEPS.map((s,j)=>{const c=stepCount(r,s),full=s.keys.length&&c===s.keys.length;
      return `<button class="cell" data-step="${j}"><span class="badge ${full?'done':''}" style="${j===view.step?'background:var(--accent);color:#fff':''}">${full?IC.check:j+1}</span><span class="main"><span class="ttl">${esc(s.name)}</span></span><span class="det">${s.keys.length?c+' of '+s.keys.length:''}</span>${IC.chev}</button>`}).join(''))}</div>`;
  const root=$('#sheetRoot');
  root.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>goStep(+b.dataset.step));
  $('#scrim').onclick=closeSheet;$('#sheetDone').onclick=closeSheet;
  requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.add('sheet-open')));
}
function closeSheet(){const root=$('#sheetRoot');if(!root.classList.contains('sheet-open')){root.innerHTML='';return}
  root.classList.remove('sheet-open');setTimeout(()=>{if(!root.classList.contains('sheet-open'))root.innerHTML=''},320)}

/* ---------- events ---------- */
function bind(){
  const on=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(ev,fn)};
  const tog=document.getElementById('editToggle');if(tog)tog.onclick=()=>{view.edit=!view.edit;view.confirm=null;rerender()};
  document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{view.confirm=b.dataset.ask;rerender()});
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>{view.confirm=null;rerender()});
  document.querySelectorAll('[data-yes]').forEach(b=>b.onclick=async()=>{
    const [kind,key]=b.dataset.yes.split(/:(.*)/);b.disabled=true;
    if(kind==='insp'){await removeItem(key);view.confirm=null;
      if(!dayItems(view.day).length)view.edit=false;rerender();toast('Inspection deleted');return}
    const ids=Object.keys(S.items).filter(id=>S.items[id].day===key);
    for(const id of ids)await removeItem(id);
    view.confirm=null;toast(`Deleted ${medDate(key)}`);
    if(view.name==='day')goBack('home');else{if(!Object.keys(S.items).length)view.edit=false;rerender()}});
  document.querySelectorAll('#app [data-open]').forEach(b=>b.onclick=()=>{const v=S.items[b.dataset.open];go('insp',{id:b.dataset.open,day:v.day,step:0})});
  if(view.name==='home'){
    on('dayPick','change',e=>{if(e.target.value){view.day=e.target.value;rerender()}});
    on('openDay','click',()=>go('day'));
    on('find','input',e=>{view.q=e.target.value;const pos=e.target.selectionStart;rerender();const f=$('#find');f.focus();f.setSelectionRange(pos,pos)});
    document.querySelectorAll('[data-s]').forEach(el=>el.addEventListener('change',()=>{S.settings[el.dataset.s]=el.value.trim();saveSettings()}));
    document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>go('day',{day:b.dataset.day}));
    on('routeText','input',e=>{view.routeDraft=e.target.value});
    on('routeGo','click',()=>{const r=importRoute($('#routeText').value);if(!r)return;view.routeDraft='';
      toast(r.added?`Added ${r.added} inspection${r.added>1?'s':''}`+(r.skipped?` (${r.skipped} already there)`:''):'Those are already on that day');go('day',{day:r.day})});
    on('bkSave','click',saveBackup);on('bkFile','change',e=>loadBackup(e.target));
    return;
  }
  if(view.name==='day'){
    on('back','click',()=>goBack('home'));
    on('newDay','click',()=>{goBack('home');const d=$('#dayPick');if(d){d.focus();try{d.showPicker()}catch(e){}}});
    on('addInsp','click',()=>{const id=newId();
      S.items[id]={kind:'inspection',day:view.day,order:Date.now(),status:'draft',date:usDate(view.day),inspector:S.settings.inspector||'',createdAt:Date.now()};
      touch(id);go('insp',{id,step:0})});
    on('expZip','click',exportZip);on('expEach','click',exportEach);
    return;
  }
  const r=S.items[view.id];if(!r)return;
  updateSaveLabel();
  on('back','click',()=>{flush();goBack('day',{day:r.day})});
  on('nextStep','click',()=>goStep(view.step+1));
  on('prevStep','click',()=>goStep(view.step-1));
  on('openSteps','click',openSheet);
  document.querySelectorAll('#app [data-chk]').forEach(b=>b.onclick=()=>goChk(+b.dataset.chk));
  on('chkPrev','click',()=>goChk(view.chk-1));on('chkNext','click',()=>goChk(view.chk+1));
  on('chkClose','click',()=>{view.chk=null;rerender()});
  on('chkOk','click',()=>{const L=chkList(r),x=view.chk;r.aiCheck=L;L[x].ok=!L[x].ok;touch(view.id);
    if(!L[x].ok){rerender();return}
    const nx=L.findIndex((c,j)=>j>x&&!c.ok),any=L.findIndex(c=>!c.ok);
    if(nx>=0)goChk(nx);else if(any>=0)goChk(any);else{view.chk=null;rerender();toast('All checks done')}});
  document.querySelectorAll('#app [data-step]').forEach(b=>b.onclick=()=>goStep(+b.dataset.step));
  const refreshCount=()=>{const s=STEPS[view.step],el=$('#stepCount');if(el)el.textContent=stepCount(r,s)+' of '+s.keys.length;
    const bar=document.querySelectorAll('.prog i')[view.step];if(bar&&s.keys.length)bar.style.setProperty('--p',stepCount(r,s)/s.keys.length)};
  const syncChips=key=>document.querySelectorAll(`[data-add="${key}"],[data-set="${key}"]`).forEach(c=>c.setAttribute('aria-pressed',chipOn(r,key,phraseOf(c.dataset.p),c.dataset.set?'set':'add')));
  document.querySelectorAll('[data-t]').forEach(el=>el.addEventListener('input',()=>{
    const k=el.dataset.t;r[k]=el.value;touch(view.id);syncChips(k);refreshCount();
    if(k==='facilityName'){const m=$('.nav .mid');if(m)m.textContent=el.value||'New Inspection'}
    if(/^b\dn$/.test(k)&&!el.value.trim()){r[k.slice(0,2)+'sel']=[];document.querySelectorAll(`[data-bmp="${k.slice(0,2)}"]`).forEach(c=>c.setAttribute('aria-pressed',false))}
  }));
  const paintSeg=(box,k)=>{const btns=[...box.querySelectorAll('button')],idx=btns.findIndex(x=>x.dataset.v===r[k]);
    btns.forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===r[k]));
    if(box.classList.contains('sc')){const fromEmpty=!box.dataset.v;box.classList.toggle('snap',fromEmpty);if(idx>=0)box.style.setProperty('--i',idx);box.dataset.v=idx>=0?r[k]:''}};
  document.querySelectorAll('#app [data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,v=b.dataset.v,box=b.parentElement;
    if(k==='photoDays'){r.photoDays=v;S.settings.photoDays=v;saveSettings();touch(view.id);paintSeg(box,'photoDays');return}
    r[k]=r[k]===v&&box.classList.contains('sc')?'':v;
    if(/^b\d$/.test(k)){
      const nk=k+'n',cur=(r[nk]||'').trim(),auto=!cur||Object.values(PHRASES[k]).flat().includes(cur);
      if(auto){r[nk]=(r[k]==='Yes'||r[k]==='N/A')&&PHRASES[k][r[k]][0]||'';r[k+'sel']=[]}
      touch(view.id);paintSeg(box,k);view.reveal=k;setTimeout(rerender,170);return}
    touch(view.id);paintSeg(box,k);refreshCount();
  });
  document.querySelectorAll('[data-typical]').forEach(b=>b.onclick=()=>{const t=TYPICAL[b.dataset.typical];let n=0;
    Object.keys(t).forEach(k=>{if(!r[k]){r[k]=t[k];n++}});touch(view.id);rerender();toast(n?`Filled ${n} blank${n>1?'s':''}`:'Nothing blank to fill')});
  const phraseOf=p=>{if(p.startsWith('x:'))return EXTRA_LINES[+p.slice(2)][1];if(p.startsWith('cl:'))return CORRECTIVE_LINES[+p.slice(3)];const [q,a,i]=p.split('|');return PHRASES[q][a][+i]};
  const setField=(key,val,focusBlank)=>{r[key]=val;touch(view.id);syncChips(key);refreshCount();const ta=document.getElementById('f_'+key);if(ta){ta.value=val;const at=focusBlank?val.lastIndexOf('___'):-1;if(at>=0){ta.focus();ta.setSelectionRange(at,at+3)}}};
  document.querySelectorAll('[data-add]').forEach(c=>c.onclick=()=>{
    const key=c.dataset.add,text=phraseOf(c.dataset.p),cur=(r[key]||'').trim();
    if(cur.includes(text))setField(key,cur.replace(text,'').replace(/\s{2,}/g,' ').trim());
    else setField(key,cur?cur+' '+text:text,true)});
  document.querySelectorAll('#app [data-set]').forEach(c=>c.onclick=()=>setField(c.dataset.set,phraseOf(c.dataset.p),true));
  document.querySelectorAll('[data-bmp]').forEach(c=>c.onclick=()=>{
    const k=c.dataset.bmp,i=+c.dataset.i,key=k+'n',list=PHRASES[k].No;
    let sel=(r[k+'sel']||[]).filter(j=>j!==i),text=(r[key]||'').replace(IMPL,' ').replace(/\s{2,}/g,' ').trim();
    const body=list[i].replace(IMPL,'').trim(),adding=!(r[k+'sel']||[]).includes(i);
    if(adding){sel.push(i);text=text?text+' '+body:body}
    else text=text.replace(new RegExp(body.split('___').map(reEsc).join('[\\s\\S]*?')),'').replace(/\s{2,}/g,' ').trim();
    r[k+'sel']=sel;
    setField(key,[text,implLine(sel.flatMap(j=>bmpCodes(list[j])))].filter(Boolean).join(' '),adding);
    c.setAttribute('aria-pressed',adding)});
  const fillWrap=fix=>{
    const t=templates(r);r.outcome=fix?'fix':'ok';
    r.checklistComments=fix?t.fixComments:t.okComments;r.enforcement=fix?t.fixEnf:t.okEnf;r.corrective=fix?'Corrections issued.':'None.';
    // In the filed reports these three always follow the outcome.
    Object.assign(r,fix?{bmpsAcceptable:'No',goodHousekeeping:'No',returnRequired:'Yes'}:{bmpsAcceptable:'Yes',goodHousekeeping:'Yes',returnRequired:'No'});
    if(!r.compliance)r.compliance=fix?'Correction Issued':COMPLIANCE[0];
    if(!r.enforcementAction)r.enforcementAction=fix?'Yes':'No';
    if(!r.reportProvided)r.reportProvided='Yes';
    touch(view.id);rerender();toast(fix?'Written up with corrections':'Written up as compliant')};
  on('fillOk','click',()=>fillWrap(false));on('fillFix','click',()=>fillWrap(true));
  on('markDone','click',()=>{r.status=r.status==='done'?'draft':'done';touch(view.id);
    if(r.status==='done'){flush();goBack('day',{day:r.day,justDone:view.id});toast('Inspection done')}else rerender()});
  on('returnInsp','click',()=>{const id=newId(),d=todayISO();
    S.items[id]={kind:'inspection',day:d,order:Date.now(),status:'draft',date:usDate(d),inspector:S.settings.inspector||r.inspector||'',facilityId:r.facilityId||'',facilityName:r.facilityName||'',email:r.email||'',sic:r.sic||'',priority:r.priority||'',contactName:r.contactName||'',contactTitle:r.contactTitle||'',returnOf:view.id,createdAt:Date.now(),
      checklistComments:'Return inspection to verify corrections from the '+(r.date||usDate(r.day))+' inspection.'};
    touch(id);go('insp',{id,day:d,step:0});toast('Return inspection added to today')});
  on('delAsk','click',()=>{$('#delZone').innerHTML=`<div class="open-down"><div class="cell"><span class="sub" style="font-size:15px;white-space:normal">Delete ${esc(r.facilityName||'this inspection')} for good?</span></div><button class="cell danger" id="delYes">Delete</button><button class="cell center" id="delNo">Keep It</button></div>`;
    on('delYes','click',async()=>{const d=r.day;await removeItem(view.id);goBack('day',{day:d});toast('Inspection deleted')});
    on('delNo','click',()=>rerender())});
  on('skipNotes','click',()=>goStep(1));
  on('makePdf2','click',()=>makePdf('makePdf2'));on('emailPdf','click',()=>emailPdf('emailPdf'));on('emailPdf2','click',()=>emailPdf('emailPdf2'));
  if(view.step===STEPS.length-1)warmPdf(r);
}

/* ---------- PDF ---------- */
let template=null;
// Filed as: "BRP00000000 - Sample Business 1-2-2026.pdf"
function fileName(r){
  const d=(r.date||usDate(r.day)).trim().split(/[\/.-]/).map(x=>/^\d+$/.test(x)?String(+x):x).join('-');
  return [(r.inspectionId||r.facilityId||'Inspection').trim(),'-',(r.facilityName||'').trim(),d].filter(Boolean).join(' ').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ')+'.pdf'}
async function pdfFor(r){if(!template)template=await (await fetch('brp-form.pdf')).arrayBuffer();return BRPForm.fill(PDFLib,template.slice(0),r)}
/* Getting files out: the share sheet on phones and iPads (Mail, Files, Print), a download elsewhere. */
function asFile(bytes,name,type){return new File([bytes],name,{type:type||'application/pdf'})}
function canShare(files){try{return !!(navigator.canShare&&navigator.canShare({files}))}catch(e){return false}}
function download(file){const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function shareOrSave(files,meta){
  if(canShare(files)){try{await navigator.share({files,...(meta||{})});return 'shared'}catch(e){if(e&&e.name==='AbortError')return 'cancelled';throw e}}
  files.forEach(download);return 'saved'}
function exportList(){return dayItems(view.day).map(([,v])=>v)}
/* Safari only opens the share sheet straight after a tap, so the PDF is made ahead of time. */
const ready={};
function warmPdf(r){const id=view.id,stamp=r.updatedAt||0;if(ready[id]&&ready[id].stamp===stamp)return ready[id].p;
  const p=pdfFor(r).then(b=>asFile(b,fileName(r)));p.catch(()=>{});ready[id]={stamp,p};return p}
async function getPdf(id){const r=S.items[id];const w=warmPdf(r);return w}
function mailText(r){const fix=hasCorrections(r);
  return {title:'NPDES Inspection Report - '+(r.facilityName||'')+' - '+(r.date||usDate(r.day)),
    text:'Hello'+(r.contactName?' '+r.contactName.trim():'')+',\n\nAttached is the NPDES stormwater inspection report for '+(r.facilityName||'your facility')+' from the inspection on '+(r.date||usDate(r.day))+'.'+
      (fix?' Please send photo documentation of the completed corrections to '+photoTo()+' within '+(r.photoDays||S.settings.photoDays||'30')+' days.':'')+
      '\n\nThank you,\n'+(S.settings.inspector||r.inspector||'')}}
async function emailPdf(btnId){
  const id=view.id,r=S.items[id],b=$('#'+btnId),label=b.innerHTML;
  const to=(r.email||'').trim();
  if(to&&navigator.clipboard)navigator.clipboard.writeText(to).catch(()=>{});
  b.disabled=true;b.innerHTML='<span class="spin"></span> Making PDF…';
  try{
    const file=await getPdf(id),m=mailText(r);
    if(canShare([file])){
      const how=await shareOrSave([file],m);
      if(how==='shared')toast(to?'Sent to the share sheet. '+to+' was copied.':'Sent to the share sheet');
    }else{
      download(file);
      location.href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(m.title)+'&body='+encodeURIComponent(m.text+'\n\n(Attach '+file.name+' from your Downloads.)');
    }
  }catch(e){
    toast(e&&e.name==='NotAllowedError'?'Tap Email Report again to open Mail.':'Could not make the PDF'+(e&&e.message?': '+e.message:''));
  }finally{b.disabled=false;b.innerHTML=label}
}
/* Day exports make their files on the first tap, then the button opens the share sheet on the second tap. */
const prepared={};
async function prepDay(kind){
  const btn=$(kind==='zip'?'#expZip':'#expEach'),label=btn.innerHTML,day=view.day,list=exportList();
  const have=prepared[kind];
  if(have&&have.day===day&&have.stamp===list.map(v=>v.updatedAt||0).join()){
    try{const how=await shareOrSave(have.files,have.meta);if(how==='saved')toast('Saved '+have.files.length+' file'+(have.files.length>1?'s':''))}
    catch(e){toast('Could not open the share sheet. Tap again.')}
    return}
  btn.disabled=true;
  try{
    const files=[],used={};
    for(let i=0;i<list.length;i++){btn.textContent='Making PDF '+(i+1)+' of '+list.length+'…';
      let n=fileName(list[i]);if(used[n]){used[n]++;n=n.replace(/\.pdf$/,' ('+used[n]+').pdf')}else used[n]=1;
      files.push(asFile(await pdfFor(list[i]),n))}
    const base='BRP Reports '+usDate(day).split('/').map(x=>String(+x)).join('-');
    let out=files;
    if(kind==='zip'){btn.textContent='Zipping…';const zip=new JSZip();files.forEach(f=>zip.file(f.name,f));out=[asFile(await zip.generateAsync({type:'blob'}),base+'.zip','application/zip')]}
    prepared[kind]={day,stamp:list.map(v=>v.updatedAt||0).join(),files:out,meta:{title:base}};
    btn.innerHTML=`<span class="main"><span class="ttl">${kind==='zip'?'Ready: tap to save the ZIP':'Ready: tap to email or share'}</span></span><span class="det">${out.length} file${out.length>1?'s':''}</span>`;
  }catch(e){btn.innerHTML=label;toast('Could not make the PDFs'+(e&&e.message?': '+e.message:''))}
  finally{btn.disabled=false}
}
const exportZip=()=>prepDay('zip'),exportEach=()=>prepDay('each');
async function makePdf(btnId){
  const id=view.id,b=$('#'+btnId),label=b.innerHTML;b.disabled=true;
  try{const file=await getPdf(id);const how=await shareOrSave([file]);if(how==='saved')toast('PDF saved: '+file.name)}
  catch(e){toast(e&&e.name==='NotAllowedError'?'Tap again to open the PDF.':'Could not make the PDF'+(e&&e.message?': '+e.message:''))}
  finally{b.disabled=false;b.innerHTML=label}
}

/* ---------- add a route: pasted rows become inspections ---------- */
function isoDay(t){if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;const [m,d,y]=t.split('/');return y+'-'+m.padStart(2,'0')+'-'+d.padStart(2,'0')}
function nice(a){const L=a.replace(/[^A-Za-z]/g,'');return L&&L.replace(/[^A-Z]/g,'').length/L.length>=0.8?a.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()).replace(/\b(Ca|Rd|Dr|St|Ave|Blvd|Ln|Ct|Cir|Pkwy|Ter)\b/g,m=>m):a}
function parseRoute(text){
  const t=String(text).replace(/ /g,' ');
  const dm=t.match(/day\s*[:=]\s*(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{4})/i);
  const items=[];
  /* Each BRP number starts a new stop, so it works even if the line breaks get lost in the copy. */
  t.split(/(?=\bBRP\d{6,}\b)/).forEach(seg=>{
    const brp=(seg.match(/^BRP\d{6,}\b/)||[])[0];if(!brp)return;
    const brpc=(seg.match(/\bBRPC\d[\w-]*/)||[])[0]||'';
    const parts=seg.split(/\t|\s*\|\s*|\r?\n/).map(x=>x.trim()).filter(Boolean);
    let cand=parts.find(p=>/^\d+\s+\S/.test(p));
    if(!cand){const m=seg.match(/\b(\d{2,6}\s+[A-Za-z][A-Za-z0-9 .'#:-]{2,60}?)(?=\s+Riverside\b|\s+BRPC|\s*$)/i);cand=m&&m[1]}
    const addr=cand?nice(cand.replace(/\s+Riverside\b.*$/i,'').replace(/\s+/g,' ').trim()):'';
    items.push({brp,brpc,addr});
  });
  return {day:dm?isoDay(dm[1]):null,items}
}
function importRoute(text){
  const {day:d,items}=parseRoute(text);
  if(!items.length){toast('No BRP numbers found. Each line needs one, like BRP21221067.');return 0}
  const day=d||view.day;let added=0,skipped=0;
  items.forEach((it,i)=>{
    if(Object.values(S.items).some(v=>v.day===day&&v.inspectionId===it.brp)){skipped++;return}
    S.items[newId()]={kind:'inspection',day,order:Date.now()+i,status:'draft',date:usDate(day),inspector:S.settings.inspector||'',facilityId:it.brpc,inspectionId:it.brp,address:it.addr,createdAt:Date.now()};
    added++});
  localSave();view.day=day;
  return {added,skipped,day}
}

/* ---------- backup ---------- */
async function saveBackup(){
  const d=todayISO(),name='Field Book backup '+d+'.json';
  const file=asFile(JSON.stringify({app:'brp-field-book',version:1,savedAt:new Date().toISOString(),settings:S.settings,items:S.items},null,1),name,'application/json');
  try{const how=await shareOrSave([file],{title:name});if(how!=='cancelled')toast('Backup ready: '+Object.keys(S.items).length+' inspections')}
  catch(e){toast('Could not save the backup')}
}
async function loadBackup(input){
  const f=input.files&&input.files[0];input.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text());if(!j||typeof j.items!=='object')throw new Error('not a Field Book backup');
    let added=0,updated=0;
    Object.entries(j.items).forEach(([id,v])=>{if(!v||v.kind!=='inspection')return;const cur=S.items[id];
      if(!cur){S.items[id]=v;added++}else if((v.updatedAt||0)>(cur.updatedAt||0)){S.items[id]=v;updated++}});
    Object.entries(j.settings||{}).forEach(([k,v])=>{if(v&&!S.settings[k])S.settings[k]=v});
    localSave();render();toast(`Loaded: ${added} new, ${updated} updated`);
  }catch(e){toast('That file is not a Field Book backup')}
}

boot();
if('serviceWorker' in navigator&&isSecureContext)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
